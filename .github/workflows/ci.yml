name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lock freshness and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: quality
      - name: Check lock freshness
        run: uv lock --check
      - name: Sync quality tools
        run: uv sync --locked --only-group quality --python 3.11
      - name: Ruff check
        run: uv run --no-sync ruff check --output-format=github survarena tests scripts

  type:
    name: Mypy (incremental kernel scope)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: quality
      - name: Sync quality tools
        run: uv sync --locked --only-group quality --python 3.11
      - name: Mypy declared scope
        run: >
          uv run --no-sync python -m mypy
          survarena/core
          survarena/benchmark/resume.py
          survarena/data/splitters.py
          scripts/audit_manuscript_publishability.py

  import-smoke:
    name: Lazy import (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: import-smoke
      - name: Sync lightweight import dependencies
        run: uv sync --locked --only-group import-smoke --python ${{ matrix.python-version }}
      - name: Import SurvArena lazily
        run: uv run --no-sync python -c "import survarena; print(survarena.__all__)"

  full-tests:
    name: Full tests and compile (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: full-tests
      - name: Sync runtime and test dependencies
        run: uv sync --locked --no-default-groups --group test --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --no-sync python -m pytest -q
      - name: Compile package
        run: uv run --no-sync python -m compileall -q survarena

  docs:
    name: Strict Sphinx documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: docs
      - name: Sync documentation tools
        run: uv sync --locked --only-group docs --python 3.11
      - name: Build documentation strictly
        run: uv run --no-sync sphinx-build -n -W --keep-going -b html docs docs/_build/html
