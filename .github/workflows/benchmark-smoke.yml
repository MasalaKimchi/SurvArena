name: Benchmark smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smallest slice (WHAS500 / CoxPH / 1 seed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: benchmark-smoke
      - name: Sync locked runtime
        run: uv sync --locked --no-default-groups --python 3.11
      - name: Run smallest benchmark slice
        run: >
          uv run --no-sync survarena benchmark run
          --config configs/benchmark/manuscript_v1.yaml
          --dataset whas500
          --method coxph
          --limit-seeds 1
          --output-dir results/ci_smoke
      - name: Assert semantic benchmark outputs
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          import numpy as np
          import pandas as pd

          root = Path("results/ci_smoke")
          fold_paths = list(root.glob("*_fold_results.csv"))
          assert len(fold_paths) == 1, fold_paths
          frame = pd.read_csv(fold_paths[0])
          required_columns = {"dataset_id", "method_id", "split_id", "seed", "hpo_mode", "status", "uno_c"}
          missing = required_columns - set(frame.columns)
          assert not missing, f"missing fold-result columns: {sorted(missing)}"
          successful = frame.loc[frame["status"].eq("success")].copy()
          assert not successful.empty, "smoke produced no successful fold rows"
          assert successful["dataset_id"].str.startswith("whas500").all()
          assert successful["method_id"].eq("coxph").all()
          assert successful["hpo_mode"].eq("no_hpo").all()
          assert np.isfinite(pd.to_numeric(successful["uno_c"], errors="coerce")).all()

          expected = {
              "coxph_fold_results.csv",
              "coxph_leaderboard.csv",
              "coxph_run_diagnostics.csv",
              "experiment_manifest.json",
              "experiment_navigator.json",
              "README.md",
          }
          missing_artifacts = expected - {path.name for path in root.iterdir()}
          assert not missing_artifacts, f"missing compact artifacts: {sorted(missing_artifacts)}"
          assert not (root / "coxph_leaderboard.json").exists()
          print(f"semantic smoke passed: {len(successful)} successful row(s), finite uno_c")
          PY
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-smoke-results
          path: results/ci_smoke
          if-no-files-found: warn
